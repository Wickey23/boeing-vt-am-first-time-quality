name: ML provenance and reproducibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml-reproducibility.yml'
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/ml-reproducibility.yml'
permissions:
  contents: read
jobs:
  research-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-reproduction.txt
      - run: python -m pip install -r ml/requirements-reproduction.txt
      - name: Evaluation contract and leakage tests
        run: python -m unittest discover -s ml/tests -v
      - name: Reproduce checksum-locked public research dataset
        run: python ml/reproduce_meltpoolnet.py --expected-sha256 197b111bcb3c531d38c8dd7ea0d4e1f78c8b6b03e0fd900a5505c2b18414a4f6 --out /tmp/orientai-ml-evaluation.json
      - name: Verify baseline and retain explicit release blockers
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          report=json.loads(Path('/tmp/orientai-ml-evaluation.json').read_text())
          assert (report['n_rows'],report['train'],report['holdout'])==(227,178,49)
          assert math.isclose(report['ridge_mae'],37.465293413900966,abs_tol=1e-7)
          assert math.isclose(report['knn7_mae'],20.781126116769663,abs_tol=1e-7)
          assert report['cross_split_duplicate_feature_target_rows']==0
          assert not report['inference_enabled']
          assert not report['evaluation']['release_eligible']
          assert len(report['evaluation']['development_leave_one_study_out'])==7
          print('Checksum-locked baseline reproduced; inference remains disabled.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orientai-ml-evaluation
          path: /tmp/orientai-ml-evaluation.json
          retention-days: 30
