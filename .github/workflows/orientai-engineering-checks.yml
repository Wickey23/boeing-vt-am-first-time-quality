name: ORIENTAI numerical and build checks
on:
  push:
    branches:
      - integration/orientai-unified-analysis
      - main
  pull_request:
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked compatible dependencies
        run: npm ci --no-audit --no-fund
      - name: Numerical engineering regression tests
        run: npm test
      - name: TypeScript verification
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Shared-workspace browser regression
        run: npm run test:e2e
